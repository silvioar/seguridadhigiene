{% extends "base.html" %}
{% block title %}Nueva visita{% endblock %}

{% block content %}
<h2>Nueva visita</h2>

<form method="post" class="card card-body bg-white">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'audits:list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
